<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <div class="login-container">
      <h2>Forgot Password</h2>

      <form id="forgotPasswordForm">
        <input type="text" id="userCode" placeholder="Enter User Code" required />

        <input type="password" id="newPassword" placeholder="Enter New Password" required />

        <input type="password" id="retypePassword" placeholder="Retype New Password" required />

        <button type="submit" id="resetPasswordBtn">Reset Password</button>
      </form>

      <p id="message" role="status"></p>

      <p>
        <a href="./index.html">Back to Login</a>
      </p>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/forgotPassword.js"></script>
  </body>
</html>
